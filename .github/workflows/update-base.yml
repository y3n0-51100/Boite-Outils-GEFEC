name: Mise à jour quotidienne de la base article

# Télécharge chaque jour la base article Excel (source protégée par mot de passe),
# la convertit en base-eco.js (format chargé par l'outil), et committe les deux
# fichiers sur main si la base a changé. L'outil récupère ainsi la base à jour
# automatiquement, sans intervention manuelle.

on:
  schedule:
    - cron: '0 0 * * *'   # tous les jours à 00:00 UTC (GitHub planifie en UTC)
  workflow_dispatch: {}    # permet aussi un déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: update-base
  cancel-in-progress: false

jobs:
  update-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Téléchargement de la base Excel (source protégée)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          BASE_USER: ${{ secrets.BASE_USER }}
          BASE_PASS: ${{ secrets.BASE_PASS }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$BASE_USER" ] || [ -z "$BASE_PASS" ]; then
            echo "::error::Secrets manquants — définissez BASE_URL, BASE_USER et BASE_PASS dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          # 3 tentatives ; un 401 = identifiants refusés par le site (le mot
          # de passe a changé) : on le dit clairement au lieu d'un code curl
          code=$(curl -sSL --retry 3 --retry-delay 10 --retry-all-errors -w '%{http_code}' \
            --user "$BASE_USER:$BASE_PASS" "$BASE_URL" -o base.new.xlsx || true)
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::Identifiants refusés par le site NOSICA (HTTP $code) — mettez à jour BASE_USER / BASE_PASS dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Téléchargement de la base impossible (HTTP $code)."
            exit 1
          fi
          # un vrai classeur Excel est une archive ZIP (signature « PK ») :
          # une page d'erreur HTML ne doit jamais écraser la base saine
          if [ "$(head -c 2 base.new.xlsx)" != "PK" ] || [ "$(stat -c%s base.new.xlsx)" -lt 100000 ]; then
            echo "::error::Le fichier reçu n'est pas une base Excel valide ($(stat -c%s base.new.xlsx) octets) — base actuelle conservée."
            exit 1
          fi
          mv base.new.xlsx base.xlsx
          echo "Téléchargé : $(stat -c%s base.xlsx) octets"

      - name: Installation de SheetJS
        run: npm install xlsx@0.18.5 --no-save

      - name: Conversion en base-eco.js
        run: node scripts/build-base.js base.xlsx base-eco.js base-checked.js

      - name: Commit & push si la base a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base.xlsx base-eco.js base-checked.js
          if git diff --cached --quiet; then
            echo "Aucun changement — la base est déjà à jour."
          else
            git commit -m "Mise à jour automatique de la base article ($(date -u +'%Y-%m-%d'))"
            git pull --rebase origin main && git push
          fi
